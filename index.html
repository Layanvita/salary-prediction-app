<!DOCTYPE html>
<html>

<head>
    <title>Salary Prediction</title>
</head>

<body>

<h1>Salary Prediction App</h1>

<form action="/predict" method="post">

    <input
        type="number"
        name="percentage"
        placeholder="Enter Percentage"
        required
    >

    <button type="submit">
        Predict Salary
    </button>

</form>

<br>

<h2>{{ prediction_text }}</h2>

</body>

</html>
